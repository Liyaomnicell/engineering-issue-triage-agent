name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: triage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage -d triage_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://triage:ci-only-password@127.0.0.1:5432/triage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - name: Verify frontend package manager
        working-directory: frontend
        run: corepack pnpm --version
      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Build Angular frontend
        working-directory: frontend
        run: corepack pnpm build
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
